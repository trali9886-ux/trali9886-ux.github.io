<style>
  /* Telegram channel notice. A centred modal rather than a corner card: the
     channel is the one contact that survives the domain, so it earns the
     attention once. The small button stays afterwards. */
  #tg-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(10, 26, 22, 0.62);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    opacity: 0;
    transition: opacity 0.22s ease;
  }
  #tg-backdrop[hidden] {
    display: none;
  }
  #tg-backdrop.tg-open {
    opacity: 1;
  }
  #tg-modal {
    position: relative;
    box-sizing: border-box;
    width: min(420px, 100%);
    max-height: calc(100vh - 40px);
    overflow-y: auto;
    padding: 36px 26px 26px;
    border: 1.5px solid transparent;
    border-radius: 24px;
    text-align: center;
    color: #fff;
    font-family: "DM Sans", system-ui, -apple-system, sans-serif;
    background:
      linear-gradient(165deg, #123a30 0%, #0d2a3a 100%) padding-box,
      linear-gradient(135deg, #34d399, #22d3ee, #7c5cff, #f472b6) border-box;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
    outline: none;
    transform: translateY(10px) scale(0.98);
    transition: transform 0.22s ease;
  }
  #tg-backdrop.tg-open #tg-modal {
    transform: none;
  }
  #tg-modal .tg-close {
    position: absolute;
    top: 14px;
    right: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
    color: #cbd5d1;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
  }
  #tg-modal .tg-close:hover {
    background: rgba(255, 255, 255, 0.16);
    color: #fff;
  }
  #tg-modal .tg-ico {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 84px;
    height: 84px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: linear-gradient(150deg, #37bbfe, #007dbb);
    box-shadow:
      0 0 0 10px rgba(42, 171, 238, 0.12),
      0 0 44px rgba(42, 171, 238, 0.55);
  }
  #tg-modal .tg-ico svg {
    width: 42px;
    height: 42px;
    margin-left: 3px;
    color: #fff;
  }
  #tg-modal .tg-eyebrow {
    margin: 0 0 10px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #7dd3fc;
  }
  #tg-modal h2 {
    margin: 0 0 12px;
    font-size: 26px;
    font-weight: 800;
    line-height: 1.22;
    color: #fff;
  }
  #tg-modal .tg-body {
    margin: 0 0 22px;
    font-size: 14px;
    line-height: 1.6;
    color: #b9c6c1;
  }
  #tg-modal .tg-body strong {
    color: #fff;
    font-weight: 700;
  }
  #tg-modal .tg-later {
    display: inline-block;
    margin: 0 0 16px;
    padding: 9px 22px;
    border: 1px solid rgba(125, 211, 252, 0.45);
    border-radius: 999px;
    background: transparent;
    color: #7dd3fc;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  #tg-modal .tg-later:hover {
    border-color: rgba(125, 211, 252, 0.8);
    color: #fff;
  }
  #tg-modal .tg-handle {
    margin: 14px 0 0;
    font-size: 12px;
    line-height: 1.55;
    color: #8fa39d;
  }
  #tg-modal .tg-handle strong {
    color: #cfe9ff;
    font-weight: 700;
  }
  #tg-modal .tg-copy {
    margin-left: 6px;
    padding: 3px 10px;
    border: 1px solid rgba(125, 211, 252, 0.4);
    border-radius: 999px;
    background: transparent;
    color: #7dd3fc;
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
  }
  #tg-modal .tg-copy:hover {
    border-color: rgba(125, 211, 252, 0.8);
    color: #fff;
  }
  #tg-modal .tg-handle.tg-alert {
    padding: 10px 12px;
    border: 1px solid rgba(125, 211, 252, 0.35);
    border-radius: 12px;
    background: rgba(125, 211, 252, 0.08);
    color: #dbeafe;
    font-size: 13px;
  }
  #tg-modal .tg-cta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 16px;
    border-radius: 14px;
    background: linear-gradient(135deg, #37bbfe, #007dbb);
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    text-decoration: none;
    box-shadow: 0 10px 26px rgba(42, 171, 238, 0.36);
  }
  #tg-modal .tg-cta:hover {
    background: linear-gradient(135deg, #4cc6ff, #0089cc);
  }
  #tg-modal .tg-cta svg {
    width: 20px;
    height: 20px;
    flex: none;
  }
  #tg-fab {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 40;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: linear-gradient(150deg, #37bbfe, #007dbb);
    color: #fff;
    text-decoration: none;
    box-shadow: 0 8px 24px rgba(42, 171, 238, 0.42);
  }
  #tg-fab svg {
    width: 22px;
    height: 22px;
    margin-left: 2px;
  }
  @media (max-width: 600px) {
    /* The app pins a full-width question-palette bar to the bottom of the
       viewport during a test (.mobile-palette-trigger, ~50px tall). Sit above
       it rather than on top of it. */
    #tg-fab {
      right: 12px;
      bottom: calc(64px + env(safe-area-inset-bottom));
    }
  }
  @media (prefers-reduced-motion: reduce) {
    #tg-backdrop,
    #tg-modal {
      transition: none;
    }
  }
</style>
</head>
<body>
<div id="root"></div>

<!-- Telegram channel notice. Kept outside #root so the app's createRoot()
     render never wipes it. -->
<div id="tg-backdrop" hidden>
  <div id="tg-modal" role="dialog" aria-modal="true" aria-labelledby="tg-modal-title" tabindex="-1">
    <button class="tg-close" type="button" aria-label="Close">&#215;</button>
    <div class="tg-ico"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></div>
    <p class="tg-eyebrow">Join our community</p>
    <h2 id="tg-modal-title">Never miss a new test 🔥</h2>
    <p class="tg-body">New tests and updates are posted on Telegram first. If this site is ever <strong>down or unavailable</strong>, that is where we will tell you what is happening.</p>
    <button class="tg-later" type="button">Maybe later</button>
    <a class="tg-cta" href="https://t.me/testseries8" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      Join Telegram Channel
    </a>
    <p class="tg-handle">Link not opening? Search <strong>@testseries8</strong> in the Telegram app <button class="tg-copy" type="button">Copy</button></p>
  </div>
</div>

<a id="tg-fab" href="https://t.me/testseries8" target="_blank" rel="noopener noreferrer" aria-label="Join our Telegram channel">
  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
</a>

<script>
  // Re-shown every 6 hours rather than once ever, so a student who ignored it
  // gets another chance without being greeted by it between every test. The one
  // thing it must never do is interrupt an attempt, which is why the cadence is
  // gated on a live test.
  (function () {
    var AT = "paperplane-tg-modal-at";
    var EVERY = 6 * 60 * 60 * 1000;
    var TEST_MAX = 3 * 60 * 60 * 1000; // the app's own longest test window

    var backdrop = document.getElementById("tg-backdrop");
    var modal = document.getElementById("tg-modal");

    // An attempt is live when it has started, has not been submitted, and is
    // still inside the test window -- the same three conditions the app uses
    // before it stops accepting answers. Attempt state lives under
    // "<storageKey>" = "paperplane-<test id>-v1"; this module's own keys do not
    // end in -v1, so the pattern cannot match them.
    function testInProgress() {
      try {
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (!/^paperplane-.+-v1$/.test(k)) continue;
          var s = JSON.parse(localStorage.getItem(k));
          if (!s || !(s.startedAt > 0) || s.submittedAt) continue;
          if (Date.now() < s.startedAt + TEST_MAX) return true;
        }
      } catch (_) {}
      return false;
    }

    var last = 0;
    try {
      last = Number(localStorage.getItem(AT)) || 0;
    } catch (_) {}
    if (Date.now() - last < EVERY) return;
    if (testInProgress()) return;

    var closed = false;
    function close() {
      if (closed) return;
      closed = true;
      backdrop.classList.remove("tg-open");
      document.documentElement.style.overflow = "";
      try {
        localStorage.setItem(AT, String(Date.now()));
      } catch (_) {}
      window.setTimeout(function () {
        backdrop.hidden = true;
      }, 220);
    }

    window.setTimeout(function () {
      if (testInProgress()) return; // one may have started while the page settled
      backdrop.hidden = false;
      void backdrop.offsetWidth; // flush the hidden state so the fade runs
      backdrop.classList.add("tg-open");
      document.documentElement.style.overflow = "hidden";
      modal.focus();
    }, 1200);

    // Indian networks poison DNS for t.me, so a browser link to it lands on a black
    // hole and the page goes blank. Telegram's own hosts are not blocked, so hand
    // off to the installed app instead of the browser.
    //
    // Three rules learned the hard way:
    //   1. Android needs an intent:// URL -- setting location.href to "tg://" is
    //      frequently ignored by Chrome, which is why the first attempt did nothing.
    //   2. Never fall back to the t.me URL on a phone. It is the one address these
    //      networks block, so falling back reproduces the exact blank page we are
    //      fixing. If the app does not open, say so on the page instead.
    //   3. On PC and Mac, Telegram Desktop registers tg:// too, so the same hand-off
    //      works; there the web preview is a fine fallback, because the block is
    //      DNS-only and desktop resolvers generally are not poisoned.
    var USER = "testseries8";
    var WEB = "https://t.me/" + USER;

    function openChannel(e) {
      if (e && e.preventDefault) e.preventDefault();
      var ua = navigator.userAgent || "";
      var mobile = /Android|iPhone|iPad|iPod/i.test(ua);

      if (/Android/i.test(ua)) {
        // Chrome launches the package itself; no browser_fallback_url, because the
        // only URL we could offer is the blocked one.
        window.location.href =
          "intent://resolve?domain=" + USER +
          "#Intent;scheme=tg;package=org.telegram.messenger;end";
      } else {
        // Telegram Desktop (Windows/macOS) and every iOS client handle tg://.
        window.location.href = "tg://resolve?domain=" + USER;
      }

      var settled = false;
      function tookOver() {
        settled = true;
        close();
      }
      window.addEventListener("pagehide", tookOver, { once: true });
      document.addEventListener(
        "visibilitychange",
        function () {
          if (document.hidden) tookOver();
        },
        { once: true }
      );
      // A desktop browser asks permission before opening an external app, which
      // takes focus off the page. Treat that as the app handling it, so we do not
      // also fire a browser navigation behind the permission prompt.
      window.addEventListener("blur", tookOver, { once: true });

      window.setTimeout(
        function () {
          if (settled || document.hidden) return; // the app took it
          if (mobile) {
            // Never send a phone to the address these networks block; explain the
            // way in, on the page, instead.
            var hint = backdrop.querySelector(".tg-handle");
            if (hint) hint.classList.add("tg-alert");
            var cb = backdrop.querySelector(".tg-copy");
            if (cb) cb.focus();
            return;
          }
          close();
          window.location.href = WEB; // desktop: the web preview
        },
        mobile ? 1500 : 2500
      );
    }

    backdrop.querySelector(".tg-close").addEventListener("click", close);
    backdrop.querySelector(".tg-later").addEventListener("click", close);
    backdrop.querySelector(".tg-cta").addEventListener("click", openChannel);
    var fab = document.getElementById("tg-fab");
    if (fab) fab.addEventListener("click", openChannel);

    // The handle is the only route that works when the app is absent and the
    // network blocks t.me, so make it easy to carry into the app.
    var copyBtn = backdrop.querySelector(".tg-copy");
    if (copyBtn) {
      copyBtn.addEventListener("click", function () {
        var handle = "@testseries8";
        function done() {
          copyBtn.textContent = "Copied";
          window.setTimeout(function () {
            copyBtn.textContent = "Copy";
          }, 1600);
        }
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(handle).then(done, function () {});
            return;
          }
        } catch (_) {}
        try {
          var ta = document.createElement("textarea");
          ta.value = handle;
          ta.setAttribute("readonly", "");
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
          done();
        } catch (_) {}
      });
    }
    backdrop.addEventListener("click", function (e) {
      if (e.target === backdrop) close();
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && !backdrop.hidden) close();
      // Keep Tab inside the dialog while it is open.
      if (e.key !== "Tab" || backdrop.hidden) return;
      var f = modal.querySelectorAll("button, a[href]");
      if (!f.length) return;
      var first = f[0];
      var lastEl = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        lastEl.focus();
      } else if (!e.shiftKey && document.activeElement === lastEl) {
        e.preventDefault();
        first.focus();
      }
    });
  })();
</script>
</body>
